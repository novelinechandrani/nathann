<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Happy Birthday, Nathan!</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Editorial Print Magazine Typography: Playfair Display, Oswald, Plus Jakarta Sans, Caveat -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Oswald:wght@500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600;1,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --paper-cream: #FFFDF7;
      --paper-butter: #FDF6C7;
      --paper-pink: #FCE0EE;
      --paper-lavender: #EADCF8;
      --paper-mint: #DCF2D3;
      --paper-peach: #FCE2CC;
      --magenta: #E1278A;
      --ink: #272226;
      --ink-soft: #5C535A;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--paper-cream);
      color: var(--ink);
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
      scroll-behavior: smooth;
    }

    .font-serif-ed {
      font-family: 'Playfair Display', Georgia, serif;
    }

    .font-cond {
      font-family: 'Oswald', sans-serif;
      letter-spacing: 0.03em;
    }

    .font-hand {
      font-family: 'Caveat', cursive;
    }

    .paper-sheet {
      background-color: var(--paper-cream);
      background-image: radial-gradient(rgba(225, 39, 138, 0.05) 1px, transparent 1px);
      background-size: 18px 18px;
    }

    .mag-card {
      border: 1.5px solid rgba(225, 39, 138, 0.22);
      box-shadow: 0 10px 26px -6px rgba(62, 42, 56, 0.10), 0 2px 6px rgba(62, 42, 56, 0.05);
    }

    .mag-cutout {
      border: 1.5px solid rgba(225, 39, 138, 0.28);
      box-shadow: 0 6px 16px -4px rgba(225, 39, 138, 0.14);
    }

    .pastel-grad-pink {
      background: linear-gradient(135deg, #FFF5FA 0%, #FCE0EE 55%, #EADCF8 100%);
    }

    .pastel-grad-butter {
      background: linear-gradient(135deg, #FFFDF5 0%, #FDF6C7 55%, #FCE2CC 100%);
    }

    .pastel-grad-mint {
      background: linear-gradient(135deg, #F7FDF4 0%, #DCF2D3 60%, #FDF6C7 100%);
    }

    .pastel-grad-lavender {
      background: linear-gradient(135deg, #F9F5FF 0%, #EADCF8 55%, #FCE0EE 100%);
    }

    /* Clean Static Passcode Gate (Zero Stickers, Zero Photos, Zero Shake) */
    .passcode-gate {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: #FCE0EE;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      user-select: none;
    }

    .passcode-gate.is-hidden {
      display: none;
    }

    .gate-card {
      background: #FFFDF7;
      border: 1.5px solid rgba(225, 39, 138, 0.28);
      border-radius: 24px;
      padding: 32px 24px;
      max-width: 360px;
      width: 100%;
      text-align: center;
      box-shadow: 0 12px 30px rgba(39, 34, 38, 0.08);
    }

    .gate-keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      max-width: 250px;
      margin: 16px auto 0;
    }

    .gate-key {
      padding: 12px 0;
      border-radius: 12px;
      border: 1.5px solid rgba(225, 39, 138, 0.25);
      background: #FFFFFF;
      color: #272226;
      font-family: 'Oswald', sans-serif;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
    }

    .gate-key:active {
      background: #FCE0EE;
    }

    /* Minimal Intro Welcome Overlay */
    .intro-overlay {
      background:
        radial-gradient(circle at 18% 22%, rgba(252, 224, 238, 0.35) 0%, transparent 45%),
        radial-gradient(circle at 82% 78%, rgba(253, 246, 199, 0.30) 0%, transparent 50%),
        linear-gradient(155deg, #35473C 0%, #445A4D 55%, #2C3B32 100%);
      transition: opacity 0.65s ease, visibility 0.65s;
    }
    .intro-overlay.hidden-intro {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* Articulated Animated Walking Nathan SVG */
    @keyframes idleBreathe {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-2.5px); }
    }

    @keyframes walkBob {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }

    @keyframes leftLegWalk {
      0%, 100% { transform: rotate(-18deg); }
      50% { transform: rotate(18deg); }
    }

    @keyframes rightLegWalk {
      0%, 100% { transform: rotate(18deg); }
      50% { transform: rotate(-18deg); }
    }

    @keyframes leftArmWalk {
      0%, 100% { transform: rotate(14deg); }
      50% { transform: rotate(-14deg); }
    }

    @keyframes rightArmWalk {
      0%, 100% { transform: rotate(-14deg); }
      50% { transform: rotate(14deg); }
    }

    @keyframes floatBubble {
      0%, 100% { transform: translate(-50%, 0px); }
      50% { transform: translate(-50%, -4px); }
    }

    @keyframes softPulse {
      0% { transform: scale(0.95); opacity: 0.75; }
      70% { transform: scale(1.38); opacity: 0; }
      100% { transform: scale(1.38); opacity: 0; }
    }

    @keyframes swayGentle {
      0%, 100% { transform: rotate(-3.5deg); }
      50% { transform: rotate(3.5deg); }
    }

    @keyframes eqDance {
      0%, 100% { height: 4px; }
      50% { height: 13px; }
    }

    .char-idle #nathan-body-group {
      animation: idleBreathe 2.4s ease-in-out infinite;
    }

    .char-walking #nathan-body-group {
      animation: walkBob 0.36s ease-in-out infinite;
    }
    .char-walking #nathan-leg-left {
      transform-origin: 28px 58px;
      animation: leftLegWalk 0.36s ease-in-out infinite;
    }
    .char-walking #nathan-leg-right {
      transform-origin: 36px 58px;
      animation: rightLegWalk 0.36s ease-in-out infinite;
    }
    .char-walking #nathan-arm-left {
      transform-origin: 20px 38px;
      animation: leftArmWalk 0.36s ease-in-out infinite;
    }
    .char-walking #nathan-arm-right {
      transform-origin: 44px 38px;
      animation: rightArmWalk 0.36s ease-in-out infinite;
    }

    .speech-bubble {
      animation: floatBubble 2.4s ease-in-out infinite;
    }
    .landmark-pulse::after {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 9999px;
      border: 2px solid var(--magenta);
      animation: softPulse 2.2s cubic-bezier(0.24, 0, 0.38, 1) infinite;
      pointer-events: none;
    }
    .flower-sway {
      transform-origin: bottom center;
      animation: swayGentle 3.5s ease-in-out infinite;
    }

    ::-webkit-scrollbar { width: 7px; height: 7px; }
    ::-webkit-scrollbar-track { background: #FAF4E8; }
    ::-webkit-scrollbar-thumb { background: #E1278A; border-radius: 9999px; }
  </style>
</head>
<body class="paper-sheet selection:bg-[#E1278A] selection:text-white">

  <!-- =====================================================================
       0. CLEAN TEXT & BUTTON PASSCODE GATE (ANNIVERSARY CODE: 060626)
       ===================================================================== -->
  <section id="passcode-gate" class="passcode-gate">
    <div class="gate-card">

      <div id="pin-boxes" class="mt-5 flex items-center justify-center gap-2">

        <div class="pin-slot w-10 h-12 rounded-xl bg-white border border-[#E1278A]/35 flex items-center justify-center font-cond text-lg font-bold text-[#272226]"></div>

      <p id="passcode-feedback" class="h-5 mt-1 font-cond text-[11px] uppercase tracking-wider text-[#E1278A]"></p>

      <div class="gate-keypad">
        <button type="button" data-key="1" class="gate-key pin-key">1</button>

        <button type="button" data-key="6" class="gate-key pin-key">6</button>

        <button type="button" data-key="8" class="gate-key pin-key">8</button>

        <button type="button" id="pin-clear-btn" class="gate-key text-xs uppercase text-[#E1278A]">Clear</button>

        <button type="button" id="pin-back-btn" class="gate-key text-xs uppercase text-[#E1278A]">Delete</button>
      </div>
    </div>
  </section>

  <!-- =====================================================================
       1. MINIMAL WELCOME SCREEN ("Happy Birthday, Nathan!" + START ONLY)
       ===================================================================== -->
  <section id="intro-screen" class="intro-overlay fixed inset-0 z-50 flex flex-col items-center justify-center px-4 text-center select-none">
    <div class="max-w-lg w-full pastel-grad-pink p-9 sm:p-12 rounded-[28px] mag-card relative overflow-hidden">
      <h1 id="intro-title" class="font-serif-ed text-4xl sm:text-5xl font-bold tracking-tight text-[#272226] leading-tight">
        Happy Birthday, Nathan!

      <button id="start-walk-btn"

        START
      </button>
    </div>
  </section>

  <!-- =====================================================================
       2. TOP NAVIGATION BAR
       ===================================================================== -->
  <header class="fixed top-0 left-0 right-0 z-30 bg-[#FFFDF7]/92 backdrop-blur-md border-b border-[#E1278A]/20 px-3 sm:px-6 py-2.5 flex items-center justify-between">
    <div class="flex items-center gap-2.5">
      <span class="w-3 h-3 rounded-full bg-[#E1278A] inline-block"></span>
      <span class="font-serif-ed font-bold text-base sm:text-lg text-[#272226] tracking-tight">
        Happy Birthday, Nathan!
      </span>
    </div>

    <div class="flex items-center gap-2 sm:gap-3">
      <!-- Progress Pill (0 / 5 Stops) -->
      <div class="flex items-center gap-2 bg-white border border-[#E1278A]/25 rounded-full px-3 py-1 text-[11px] font-cond tracking-wider text-[#272226]">
        <span id="progress-text">0 / 5</span>
        <div class="w-10 sm:w-14 h-1.5 bg-[#FCE0EE] rounded-full overflow-hidden">

        </div>
      </div>

  </header>

  <!-- Floating Editor's Margin Note Toast -->
  <div id="love-toast" class="fixed bottom-20 left-1/2 -translate-x-1/2 z-30 pointer-events-none opacity-0 translate-y-3 transition-all duration-300 max-w-xs sm:max-w-md w-[92%]">

      <p class="font-cond text-[10px] uppercase tracking-[0.2em] text-[#E1278A] mb-0.5">EDITOR'S MARGIN DOODLE</p>
      <p id="love-toast-text" class="font-hand text-2xl leading-snug text-[#272226]"></p>
    </div>
  </div>

  <!-- =====================================================================

    <!-- Main Interactive World Container (1720px height for 5 balanced stops) -->

      <!-- ===============================================================

        <div class="landmark-pulse relative w-7 h-7 rounded-full bg-[#2563EB] text-white font-cond text-xs flex items-center justify-center mb-2 shadow">
          4

        <div class="transition-transform duration-300 group-hover:scale-105 pastel-grad-mint p-3 rounded-2xl mag-card">
          <svg width="112" height="84" viewBox="0 0 120 92" fill="none">
